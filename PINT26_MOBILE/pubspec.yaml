name: projeto_pratico
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.2
  cupertino_icons: ^1.0.2
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.6.0
  google_fonts: ^8.1.0
  flutter_riverpod: ^2.5.1
  pdf: ^3.11.0
  printing: ^5.11.0
  share_plus: 12.0.2
  shared_preferences: ^2.5.5
  sqflite_common_ffi_web: ^1.1.1
  file_picker: ^11.0.2
  http_parser: ^4.1.2
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  fl_chart: ^1.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  app_badge_plus: ^1.3.4
  pdfrx: ^2.4.7
  path_provider: ^2.1.5
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo-softinsa.svg
    - assets/images/app_logo.png
    - assets/icons/Icon_backend.svg
    - assets/icons/Icon_design.svg
    - assets/icons/Icon_data.svg
    - assets/icons/Icon_cybersecurity.svg
    - assets/icons/Icon_cloud.svg
    - assets/icons/Icon_frontend.svg

